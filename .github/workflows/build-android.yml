name: Build Android APK and Deploy Pages (Final Optimized)

on:
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Motivo do build'
        required: false
        default: 'Build manual'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ESTE PASSO SUBSTITUI O CACHE MANUAL E MATA O DOWNLOAD DO GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          # Ele intercepta o wrapper do Capacitor e usa o cache do GitHub
          cache-disabled: false
          generate-job-summary: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS Deps
        run: npm ci

      - name: Build Web App
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          # Garante que o wrapper existe antes de rodar
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Latest Build"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
